name: Tests
on: [push, pull_request, workflow_dispatch]

jobs:
  tests-job:
    runs-on: alpine-uv
    # Playwright requires glibc, so use Debian on the existing runner.
    container:
      image: ghcr.io/astral-sh/uv:0.12.22-python3.14-trixie

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      # MARK: Environment

      - name: Prepare job container
        run: |
          # Podman's archive API rejects absolute symlinks in copied paths.
          ln -sfnT ../run /var/run
          apt-get update
          apt-get install -y --no-install-recommends git nodejs just

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install headless Chromium
        run: uv run playwright install --with-deps chromium --only-shell

      - name: Verify Python version
        run: |
          uv run python --version
          test "$(uv run python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "$UV_PYTHON"

      # MARK: Code quality

      - name: Ruff checks
        run: just ruff-check

      - name: Ruff format checks
        run: uv run ruff format --check .

      - name: Pyrefly checks
        run: just typecheck

      - name: Run tests with coverage
        run: just test

      - name: Upload coverage
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: coverage-${{ matrix.python-version }}
          if-no-files-found: error
          path: .cache/coverage

  cov-badge-job:
    needs: tests-job
    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
    runs-on: alpine-uv
    container:
      image: ghcr.io/astral-sh/uv:0.12.22-python3.14-trixie

    env:
      UV_PYTHON: "3.12"

    steps:
      # MARK: Environment

      - name: Prepare job container
        run: |
          # Podman's archive API rejects absolute symlinks in copied paths.
          ln -sfnT ../run /var/run
          apt-get update
          apt-get install -y --no-install-recommends git nodejs

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Download coverage
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: coverage-3.12
          path: .cache

      # MARK: Coverage badge

      - name: Generate coverage badge
        run: |
          uv run coverage xml
          uv run --with 'genbadge[coverage]' genbadge coverage -i coverage.xml -o assets/coverage.svg

      - name: Commit and push coverage badge if changed
        run: |
          git add assets/coverage.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "actions[bot]"
          git config user.email "actions[bot]@users.noreply.git.budgetflow.cc"
          git commit -m "Updated assets/coverage.svg"
          git push origin HEAD:refs/heads/main
