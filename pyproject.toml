[project]
name = "flask-squeeze"
version = "4.1.0"
description = "Compress and minify Flask responses!"
readme = "README.md"
authors = [{ name = "Marcel Kröker", email = "kroeker.marcel@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Programming Language :: Python",
	"Topic :: Software Development :: Libraries :: Python Modules",
]


##########################################################################################
#### MARK: Dependencies


requires-python = ">=3.11, <3.15"

dependencies = ["flask>=1", "brotli>=1.1", "turbohtml>=1.8.0"]

[dependency-groups]
dev = [
	"coverage~=7.16.0",
	"playwright~=1.55",
	"pyrefly~=1.3.0",
	"ruff~=0.16.0",
	"typing-extensions~=4.16.0",
]


##########################################################################################
#### MARK: Packaging


[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flask_squeeze"
module-root = ""

[tool.uv]
package = true


##########################################################################################
#### MARK: Ruff


[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py311"
show-fixes = true
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"COM812", # Trailing comma missing, conflicts with the formatter
	"CPY",    # Copyright notice missing
	"D",      # docstrings
	"ERA001", # Found commented-out code, fires on MARK headers
	"PT",     # flake8-pytest-style, tests use unittest
	"W191",   # indentation contains tabs
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint.isort]
split-on-trailing-comma = false # If imports fit in one line format them in one line


##########################################################################################
#### MARK: Pyrefly


[tool.pyrefly]
python-version = "3.11"
min-severity = "warn"
preset = "strict"

[tool.pyrefly.errors]
implicit-any-lambda = "ignore"


##########################################################################################
#### MARK: Testing


[tool.coverage.run]
branch = true
data_file = ".cache/coverage"
source = ["flask_squeeze"]

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]
exclude_also = ["if TYPE_CHECKING:"]
